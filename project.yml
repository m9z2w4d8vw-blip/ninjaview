name: NinjaView

options:
  bundleIdPrefix: com.parv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  NinjaView:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: NinjaView
        PRODUCT_BUNDLE_IDENTIFIER: com.parv.ninjaview
        # Committed plist (not generated) so CFBundleVersion can come from the CI run number.
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # Fakesigned onto the binary by the workflow with ldid so Time Sensitive alerts work.
        CODE_SIGN_ENTITLEMENTS: Config/NinjaView.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  NinjaView:
    build:
      targets:
        NinjaView: all
    run:
      config: Debug
    archive:
      config: Release
